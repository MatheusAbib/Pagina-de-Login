<main>
  <section class="form-section">
    <img src="/svg/logo.png"/>
    <h2> {{ title }}</h2>
    <ng-content> </ng-content>
    <div class="btn-wrapper">
      <button class="btn-primary" (click)="submit()" [disabled]="disablePrimaryBtn"> {{primaryBtnText}} </button> <!--Quando o botão for clicado, ele chamara a função submit-->

      <div class="divider">
        <div></div>
        <span>ou</span>
        <div></div>
      </div>
      <button class="btn-secondary" (click)="navigate()"> {{secondaryBtnText}} </button>
    </div>
  </section>
  <section class="main-section">
    <h1> Cadastre-se e entre!</h1>
    <img  src="/svg/delivery.svg" >
  </section>
</main>
