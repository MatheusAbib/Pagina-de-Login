<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>Alterar Senha</h2>
      <button class="btn-close" (click)="onClose()">×</button>
    </header>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="input-container">
        <label class="input-label">Senha Atual</label>
        <div class="input-wrapper">
          <span class="icon bi bi-lock"></span>
          <input type="password" formControlName="currentPassword" placeholder="Digite sua senha atual">
        </div>
      </div>

      <div class="input-container">
        <label class="input-label">Nova Senha</label>
        <div class="input-wrapper">
          <span class="icon bi bi-lock"></span>
          <input type="password" formControlName="newPassword" placeholder="Nova senha (mínimo 6 caracteres)">
        </div>
      </div>

      <div class="input-container">
        <label class="input-label">Confirmar Nova Senha</label>
        <div class="input-wrapper">
          <span class="icon bi bi-lock"></span>
          <input type="password" formControlName="confirmPassword" placeholder="Confirme a nova senha">
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="isLoading">
          {{ isLoading ? 'Alterando...' : 'Alterar Senha' }}
        </button>
      </div>
    </form>
  </div>
</div>
