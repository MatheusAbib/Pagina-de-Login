<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>
        <span class="bi bi-lock"></span>
        Esqueceu a senha?
      </h2>
      <button class="btn-close" (click)="onClose()">
        <span class="bi bi-x-lg"></span>
      </button>
    </header>

    <div *ngIf="!emailSent">
      <p class="modal-description">Digite seu email para receber o link de recuperação</p>

      <form [formGroup]="emailForm" (ngSubmit)="onSubmit()">
        <div class="input-container">
          <label class="input-label">Email</label>
          <div class="input-wrapper">
            <span class="icon bi bi-envelope"></span>
            <input
              type="email"
              formControlName="email"
              placeholder="seu@email.com"
            >
          </div>
          <div class="error-container" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
            <div *ngIf="emailForm.get('email')?.hasError('required')" class="error-message">Email é obrigatório</div>
            <div *ngIf="emailForm.get('email')?.hasError('email')" class="error-message">Email inválido</div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
          <button type="submit" class="btn-send" [disabled]="emailForm.invalid || isLoading">
            <span class="bi bi-send"></span>
            {{ isLoading ? 'Enviando...' : 'Enviar link' }}
          </button>
        </div>
      </form>
    </div>

    <div *ngIf="emailSent" class="success-content">
      <div class="success-icon">
        <span class="bi bi-check-circle"></span>
      </div>
      <h3>Email enviado!</h3>
      <p>Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
    </div>
  </div>
</div>
