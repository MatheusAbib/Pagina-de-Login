<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>
        <span class="bi bi-geo-alt"></span>
        {{ address ? 'Editar Endereço' : 'Novo Endereço' }}
      </h2>
      <button class="btn-close" (click)="onClose()">
        <span class="bi bi-x-lg"></span>
      </button>
    </header>

    <div class="cep-search">
      <div class="input-container">
        <label class="input-label">Buscar por CEP</label>
        <div class="input-wrapper">
          <span class="icon bi bi-search"></span>
          <input
            type="text"
            placeholder="00000-000"
            (blur)="searchCep($event)"
            mask="00000-000"
            #cepInput
          >
        </div>
      </div>
    <button (click)="searchCep(cepInput)" class="btn-cep">
      <span class="bi bi-search"></span> Buscar
    </button>
    </div>

    <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="input-container">
          <label class="input-label">Endereço *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-house"></span>
            <input type="text" formControlName="endereco_entrega" placeholder="Rua, Avenida...">
          </div>
        </div>
        <div class="input-container">
          <label class="input-label">Número *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-hash"></span>
            <input type="text" formControlName="numero" placeholder="123">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="input-container">
          <label class="input-label">Bairro *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-geo-alt"></span>
            <input type="text" formControlName="bairro" placeholder="Seu bairro">
          </div>
        </div>
        <div class="input-container">
          <label class="input-label">CEP *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-mailbox"></span>
            <input type="text" formControlName="cep" placeholder="00000-000" mask="00000-000">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="input-container">
          <label class="input-label">Cidade *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-buildings"></span>
            <input type="text" formControlName="cidade" placeholder="Sua cidade">
          </div>
        </div>
        <div class="input-container">
          <label class="input-label">Estado *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-flag"></span>
            <select formControlName="estado">
              <option value="">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="input-container">
          <label class="input-label">País *</label>
          <div class="input-wrapper">
            <span class="icon bi bi-globe"></span>
            <input type="text" formControlName="pais" placeholder="Brasil">
          </div>
        </div>
        <div class="input-container">
          <label class="input-label">Tipo de Residência</label>
          <div class="input-wrapper">
            <span class="icon bi bi-building"></span>
            <input type="text" formControlName="tipo_residencia" placeholder="Casa, Apartamento...">
          </div>
        </div>
      </div>

      <div class="input-container">
        <label class="input-label">Descrição</label>
        <div class="input-wrapper">
          <span class="icon bi bi-pencil"></span>
          <input type="text" formControlName="descricao_endereco" placeholder="Ponto de referência...">
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="addressForm.invalid || isLoading">
          <span class="bi bi-check-lg"></span>
          {{ isLoading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
